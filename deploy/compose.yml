name: pb-website
services:
  web:
    image: ${PB_RELEASE:?Set the verified image tag}
    container_name: pb-website
    restart: unless-stopped
    env_file:
      - /srv/docker/sites/petrovichbrothers/.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      CONTACT_TRUST_PROXY: "true"
    networks: [traefik-global]
    mem_limit: 256m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  archive:
    image: nginx:1.30.4-alpine
    container_name: pb-archive-gateway
    restart: unless-stopped
    volumes:
      - ./archive.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [traefik-global]
    mem_limit: 64m
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
networks:
  traefik-global:
    external: true
