name: pb-website
services:
  archive:
    image: nginx:1.30.4-alpine
    container_name: pb-archive-gateway
    restart: unless-stopped
    volumes:
      - /srv/docker/sites/petrovich-clean-webpage/state/archive.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [traefik-global]
    mem_limit: 64m
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
networks:
  traefik-global:
    external: true
