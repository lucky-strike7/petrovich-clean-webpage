server {
    listen 8080;
    server_name new.petrovichbrothers.ru;
    resolver 127.0.0.11 valid=10s ipv6=off;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Archive-Site "true" always;
    # Preview pages keep their own scripts; production analytics is excluded.
    add_header Content-Security-Policy "script-src 'self' 'unsafe-inline'; connect-src 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nAllow: /\n";
    }
    location ~ ^/sitemap.*\.xml$ { return 404; }
    location / {
        set $preview http://pb-website:3000;
        proxy_pass $preview;
        proxy_set_header Accept-Encoding "";
        sub_filter 'https://petrovichbrothers.ru/' 'https://new.petrovichbrothers.ru/';
        sub_filter_once off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_hide_header X-Robots-Tag;
        proxy_hide_header Content-Security-Policy;
        proxy_redirect https://petrovichbrothers.ru/ https://new.petrovichbrothers.ru/;
        proxy_redirect https://www.petrovichbrothers.ru/ https://new.petrovichbrothers.ru/;
    }
}
